<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Jetwire">
  <defs>
    <linearGradient id="jw-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2233"/><stop offset="1" stop-color="#0A0D14"/></linearGradient>
    <linearGradient id="jw-wire" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#00E676"/><stop offset="1" stop-color="#00F0FF"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#jw-tile)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="15.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
  <!-- tunnel: outer and inner wire of the J -->
  <path d="M45 13v23a13 13 0 0 1-26 0v-3" fill="none" stroke="url(#jw-wire)" stroke-width="4" stroke-linecap="round"/>
  <path d="M37 13v23a5 5 0 0 1-10 0v-3" fill="none" stroke="url(#jw-wire)" stroke-width="4" stroke-linecap="round"/>
  <!-- packet travelling through the tunnel -->
  <circle cx="41" cy="20" r="2.6" fill="#fff"/>
</svg>
