  <style>:root {
  --bg: #0b0c11;
  --panel: #14151c;
  --line: #24262f;
  --ctl: #1d1f29;
  --ctl-hover: #272a36;
  --text: #eceef4;
  --muted: #8a90a6;
  --mint: #7cf5e0;
  --violet: #6d5ef6;
  --grad: linear-gradient(135deg, var(--mint), var(--violet));
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; overflow: hidden;
  background: var(--bg); color: var(--text);
  font: 13px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
button, input { font: inherit; color: inherit; }

.panel {
  width: 312px; flex: none; height: 100%; overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;
}
.brand { display: flex; align-items: center; gap: 8px; padding: 16px 18px 12px; }
.brand span { font-size: 22px; font-weight: 700; letter-spacing: -0.04em; }
.brand .btn { margin-left: auto; padding: 7px 10px; }

section { padding: 12px 18px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); font-weight: 500; letter-spacing: 0; }
.hint { margin: 0; color: var(--muted); font-size: 12px; }

.seg { display: flex; background: var(--ctl); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button {
  flex: 1; border: 0; background: none; padding: 6px 2px; border-radius: 7px;
  cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap;
}
.seg.wrap { flex-wrap: wrap; }
.seg.wrap button { flex: 1 0 22%; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--ctl-hover); color: var(--text); box-shadow: inset 0 0 0 1px rgba(124, 245, 224, .35); }

.row { display: grid; grid-template-columns: 76px 1fr; align-items: center; color: var(--muted); }
.row2 { display: flex; gap: 8px; }
.row2 > * { flex: 1; }
.row2 > .swatch { flex: 0 0 auto; padding: 6px 10px; }
input[type=range] { width: 100%; accent-color: var(--mint); height: 18px; margin: 0; }

.btn {
  border: 0; border-radius: 9px; padding: 9px 10px; cursor: pointer; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.ghost { background: var(--ctl); font-weight: 500; }
.btn.ghost:hover { background: var(--ctl-hover); }
.btn.primary { background: var(--grad); color: #0b0c11; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary.stop { background: #ff5d6c; color: #fff; }
.btn.on { box-shadow: inset 0 0 0 1px var(--mint); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.wide { width: 100%; }
.btn input[type=color] { width: 22px; height: 22px; padding: 0; border: 0; background: none; cursor: pointer; }

.thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.thumb, .add {
  aspect-ratio: 1; border-radius: 8px; background: var(--ctl) center/cover no-repeat;
  position: relative; cursor: grab; border: 1px solid var(--line);
}
.thumb.over { outline: 2px solid var(--mint); }
.thumb button {
  position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; border-radius: 50%;
  border: 0; background: #000; color: #fff; font-size: 12px; line-height: 18px; padding: 0;
  cursor: pointer; opacity: 0;
}
.thumb:hover button, .thumb button:focus-visible { opacity: 1; }
.add { cursor: pointer; border-style: dashed; color: var(--muted); font-size: 20px; }
.add:hover { color: var(--text); border-color: var(--muted); }

.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.swatches button {
  aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); cursor: pointer;
  background: center/cover no-repeat; padding: 0;
}
.swatches button.on { outline: 2px solid var(--mint); outline-offset: 1px; }

.export { margin-top: auto; position: sticky; bottom: 0; padding: 12px 18px 14px; background: var(--panel); border-top: 1px solid var(--line); display: grid; gap: 8px; }

.stage { flex: 1; min-width: 0; min-height: 0; overflow: hidden; position: relative; display: grid; place-items: center; padding: 28px;
  background: radial-gradient(circle at 50% 40%, #171922, var(--bg)); }
#canvas { border-radius: 10px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); cursor: grab; touch-action: none; }
#canvas.dragging { cursor: grabbing; }
.drop {
  position: absolute; inset: 14px; border: 2px dashed var(--mint); border-radius: 16px;
  display: none; place-items: center; font-size: 20px; font-weight: 600;
  background: rgba(11, 12, 17, .8); pointer-events: none;
}
.drop.show { display: grid; }

:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }

@media (max-width: 760px) {
  body { flex-direction: column-reverse; }
  .panel { width: 100%; height: 48%; border-right: 0; border-top: 1px solid var(--line); }
  .stage { padding: 12px; }
}
</style>

    <section>
      <h2>View</h2>
      <div class="seg" data-key="view">

      <p class="hint">Drag the canvas to rotate, scroll to zoom, double-click to reset.</p>
    </section>

    <section>
      <h2>Frame</h2>
      <div class="seg" data-key="frameStyle">
        <button data-val="glass">Glass</button>
        <button data-val="solid">Solid</button>
        <button data-val="none">None</button>
      </div>
      <div class="seg" data-key="tint">
        <button data-val="light">Light</button>
        <button data-val="dark">Dark</button>
      </div>
      <label class="row">Thickness <input type="range" data-key="frame" min="0.01" max="0.16" step="0.002"></label>
      <label class="row">Corners <input type="range" data-key="radius" min="0" max="0.16" step="0.002"></label>
      <label class="row">Blur <input type="range" data-key="blur" min="0.1" max="3" step="0.01"></label>
    </section>

    <section>
      <h2>Shadow / glow</h2>
      <div class="row2">
        <div class="seg" data-key="shadowType">
          <button data-val="shadow">Shadow</button>
          <button data-val="glow">Glow</button>
        </div>
        <label class="btn ghost swatch">Colour <input id="shadowColor" type="color" value="#08081a"></label>
      </div>
      <label class="row">Strength <input type="range" data-key="shadow" min="0" max="1" step="0.01"></label>
      <label class="row">Elevation <input type="range" data-key="elevation" min="-1" max="1" step="0.01"></label>
      <label class="row">Spread <input type="range" data-key="spread" min="-1" max="1" step="0.01"></label>
    </section>

    <section>
      <h2>Background</h2>
      <div id="swatches" class="swatches"></div>
      <div class="row2">
        <label class="btn ghost">Colour <input id="bgColor" type="color" value="#6d5ef6"></label>
        <button id="bgImage" class="btn ghost">Image…</button>
        <button id="grain" class="btn ghost" title="Add film grain to the background">Grain</button>
        <input id="bgFile" type="file" accept="image/*" hidden>
      </div>
    </section>

    <section>
      <h2>Canvas</h2>
      <div class="seg" data-key="aspect">
        <button data-val="16:9">16:9</button>
        <button data-val="4:3">4:3</button>
        <button data-val="1:1">1:1</button>
        <button data-val="4:5">4:5</button>
        <button data-val="9:16">9:16</button>
      </div>
    </section>

    <section>
      <h2>Motion</h2>
      <div class="seg" data-key="motion">
        <button data-val="swing">Swing</button>
        <button data-val="float">Float</button>
        <button data-val="reveal">Reveal</button>
        <button data-val="shuffle">Shuffle</button>
      </div>
      <div class="seg" data-key="duration">
        <button data-val="3">3 s</button>
        <button data-val="5">5 s</button>
        <button data-val="7">7 s</button>
        <button data-val="10">10 s</button>
      </div>
      <button id="preview" class="btn ghost wide">Preview motion</button>
    </section>

    <footer class="export">
      <div class="row2">
        <button id="png" class="btn primary">PNG</button>
        <button id="png2" class="btn primary">PNG 2×</button>
